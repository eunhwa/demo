services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: integration_demo
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 설정해 주세요}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_user -d integration_demo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: